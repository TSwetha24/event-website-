services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: watchpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/watchpulse
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      DATA_PROVIDER: mock
      POLL_INTERVAL_SECONDS: 60
      PRICE_MOVE_HIGH_THRESHOLD: "3.0"
      PRICE_MOVE_MEDIUM_THRESHOLD: "1.5"
      RELATIVE_MOVE_HIGH_THRESHOLD: "2.0"
      RELATIVE_MOVE_MEDIUM_THRESHOLD: "1.0"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3001:3000"
    command: >
      sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  pgdata:
